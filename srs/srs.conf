listen              1935;
max_connections     1000;
daemon              off;

http_server {
    enabled         on;
    listen          8080;
}

http_api {
    enabled         on;
    listen          1985;
}

vhost __defaultVhost__ {
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
    http_hooks {
        enabled         on;
        on_publish      http://host.docker.internal:9001/api/live/callback/on_publish;
        on_unpublish    http://host.docker.internal:9001/api/live/callback/on_unpublish;
    }
}
