<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直播间</title>
    <script src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f0f0f; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

        .container {
            display: flex;
            height: 100vh;
        }

        /* 左侧：视频区 */
        .video-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .room-header {
            padding: 12px 20px;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .room-header h1 { font-size: 18px; font-weight: 600; }
        .status-badge {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-0 { background: #555; color: #aaa; }
        .status-1 { background: #e53935; color: #fff; animation: pulse 1.5s infinite; }
        .status-2 { background: #333; color: #888; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.7} }

        .viewer-count { margin-left: auto; font-size: 13px; color: #aaa; }

        .video-wrapper {
            flex: 1;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .video-placeholder {
            text-align: center;
            color: #666;
        }
        .video-placeholder .icon { font-size: 64px; margin-bottom: 16px; }
        .video-placeholder p { font-size: 16px; }

        /* 弹幕层 */
        .danmaku-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .danmaku-item {
            position: absolute;
            white-space: nowrap;
            font-size: 22px;
            font-weight: 600;
            color: #fff;
            text-shadow: 1px 1px 3px rgba(0,0,0,.8);
            animation: danmaku-scroll linear forwards;
        }
        @keyframes danmaku-scroll {
            from { transform: translateX(100%); }
            to { transform: translateX(-100%); }
        }

        /* OBS 推流信息 */
        .obs-info {
            padding: 10px 20px;
            background: #1a1a1a;
            border-top: 1px solid #333;
            font-size: 13px;
            color: #aaa;
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }
        .obs-info label { color: #888; margin-right: 6px; }
        .obs-info code {
            background: #2a2a2a;
            padding: 2px 8px;
            border-radius: 4px;
            color: #4fc3f7;
            font-size: 12px;
            cursor: pointer;
        }
        .obs-info code:hover { background: #333; }

        /* 右侧：聊天区 */
        .chat-area {
            width: 360px;
            display: flex;
            flex-direction: column;
            background: #1a1a1a;
            border-left: 1px solid #333;
        }
        .chat-header {
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 600;
            border-bottom: 1px solid #333;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
        }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }

        .msg {
            margin-bottom: 10px;
            line-height: 1.5;
            font-size: 14px;
        }
        .msg .nickname {
            font-weight: 600;
            margin-right: 6px;
        }
        .msg.system {
            color: #888;
            font-size: 12px;
            text-align: center;
        }
        .msg.danmaku .nickname { color: #4fc3f7; }
        .msg.like .nickname { color: #e91e63; }
        .msg.like .content { color: #e91e63; }

        /* 输入区 */
        .chat-input-area {
            padding: 12px 16px;
            border-top: 1px solid #333;
        }
        .nickname-input {
            width: 100%;
            padding: 8px 12px;
            margin-bottom: 8px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        .input-row {
            display: flex;
            gap: 8px;
        }
        .input-row input {
            flex: 1;
            padding: 8px 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .input-row input:focus, .nickname-input:focus { border-color: #4fc3f7; }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-send { background: #4fc3f7; color: #000; }
        .btn-send:hover { background: #39b0e0; }
        .btn-like { background: #e91e63; color: #fff; font-size: 18px; padding: 8px 12px; }
        .btn-like:hover { background: #c2185b; }
        .btn-danmaku { background: #ff9800; color: #000; }
        .btn-danmaku:hover { background: #e68a00; }

        .msg-type-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .msg-type-btn {
            flex: 1;
            padding: 6px;
            border: 1px solid #444;
            background: transparent;
            color: #aaa;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all .2s;
        }
        .msg-type-btn.active { border-color: #4fc3f7; color: #4fc3f7; background: rgba(79,195,247,.1); }

        .ws-status {
            font-size: 11px;
            padding: 4px 0;
            text-align: center;
        }
        .ws-status.connected { color: #4caf50; }
        .ws-status.disconnected { color: #f44336; }
    </style>
</head>
<body>

<div class="container">
    <!-- 视频区 -->
    <div class="video-area">
        <div class="room-header">
            <h1 id="roomTitle">加载中...</h1>
            <span id="statusBadge" class="status-badge status-0">未开播</span>
            <span class="viewer-count" id="viewerCount"></span>
        </div>

        <div class="video-wrapper">
            <video id="videoPlayer" controls autoplay muted></video>
            <div id="placeholder" class="video-placeholder" style="display:none;">
                <div class="icon">📺</div>
                <p>主播尚未开播，请稍候...</p>
            </div>
            <div class="danmaku-layer" id="danmakuLayer"></div>
        </div>

        <div class="obs-info" id="obsInfo">
            <div><label>OBS 服务器:</label><code onclick="copyText(this)">rtmp://localhost:1935/live</code></div>
            <div><label>推流密钥:</label><code id="streamKeyDisplay" onclick="copyText(this)">-</code></div>
            <div><label>拉流地址:</label><code id="pullUrlDisplay" onclick="copyText(this)">-</code></div>
        </div>
    </div>

    <!-- 聊天区 -->
    <div class="chat-area">
        <div class="chat-header">互动聊天</div>
        <div class="chat-messages" id="chatMessages">
            <div class="msg system">欢迎来到直播间</div>
        </div>

        <div class="chat-input-area">
            <div class="ws-status disconnected" id="wsStatus">未连接</div>
            <input class="nickname-input" id="nicknameInput" placeholder="你的昵称" value="观众" />
            <div class="msg-type-row">
                <button class="msg-type-btn active" data-type="COMMENT" onclick="setMsgType(this)">评论</button>
                <button class="msg-type-btn" data-type="DANMAKU" onclick="setMsgType(this)">弹幕</button>
            </div>
            <div class="input-row">
                <input id="msgInput" placeholder="说点什么..." onkeydown="if(event.key==='Enter')sendMessage()" />
                <button class="btn btn-send" onclick="sendMessage()">发送</button>
                <button class="btn btn-like" onclick="sendLike()">♥</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ========== 配置 ==========
    const ROOM_ID = 2;
    const API_BASE = 'http://localhost:9000';
    const WS_URL = `ws://localhost:9000/ws/live/${ROOM_ID}`;

    let flvPlayer = null;
    let ws = null;
    let msgType = 'COMMENT';
    let pullUrl = '';
    let pollTimer = null;

    // ========== 初始化 ==========
    init();

    async function init() {
        await loadRoom();
        connectWebSocket();
        // 每 5 秒轮询房间状态
        pollTimer = setInterval(loadRoom, 5000);
    }

    // ========== 房间信息 ==========
    async function loadRoom() {
        try {
            const res = await fetch(`${API_BASE}/api/live/room/${ROOM_ID}`);
            const json = await res.json();
            if (json.code !== 200) return;
            const room = json.data;

            document.getElementById('roomTitle').textContent = room.title;
            document.getElementById('streamKeyDisplay').textContent = room.streamKey;
            document.getElementById('pullUrlDisplay').textContent = room.pullUrl;
            pullUrl = room.pullUrl;

            const badge = document.getElementById('statusBadge');
            badge.className = `status-badge status-${room.status}`;
            badge.textContent = ['未开播', '直播中', '已结束'][room.status];

            const placeholder = document.getElementById('placeholder');
            const video = document.getElementById('videoPlayer');

            if (room.status === 1) {
                placeholder.style.display = 'none';
                video.style.display = 'block';
                if (!flvPlayer) startPlayer(room.pullUrl);
            } else {
                if (flvPlayer) stopPlayer();
                video.style.display = 'none';
                placeholder.style.display = 'block';
                placeholder.querySelector('p').textContent =
                    room.status === 0 ? '主播尚未开播，请稍候...' : '直播已结束';
            }
        } catch (e) {
            console.error('加载房间信息失败:', e);
        }
    }

    // ========== FLV 播放器 ==========
    function startPlayer(url) {
        if (!flvjs.isSupported()) {
            alert('浏览器不支持 FLV 播放，请使用 Chrome/Edge');
            return;
        }
        const video = document.getElementById('videoPlayer');
        flvPlayer = flvjs.createPlayer({
            type: 'flv',
            isLive: true,
            url: url
        }, {
            enableWorker: false,
            enableStashBuffer: false,
            stashInitialSize: 128,
            lazyLoad: false
        });
        flvPlayer.attachMediaElement(video);
        flvPlayer.load();
        flvPlayer.play().catch(() => {});

        flvPlayer.on(flvjs.Events.ERROR, (errType, errDetail) => {
            console.warn('播放器错误:', errType, errDetail);
            // 直播流断开时自动重试
            setTimeout(() => {
                stopPlayer();
                loadRoom();
            }, 3000);
        });
    }

    function stopPlayer() {
        if (flvPlayer) {
            flvPlayer.pause();
            flvPlayer.unload();
            flvPlayer.detachMediaElement();
            flvPlayer.destroy();
            flvPlayer = null;
        }
    }

    // ========== WebSocket ==========
    function connectWebSocket() {
        ws = new WebSocket(WS_URL);

        ws.onopen = () => {
            const el = document.getElementById('wsStatus');
            el.textContent = '已连接';
            el.className = 'ws-status connected';
        };

        ws.onclose = () => {
            const el = document.getElementById('wsStatus');
            el.textContent = '已断开，3秒后重连...';
            el.className = 'ws-status disconnected';
            setTimeout(connectWebSocket, 3000);
        };

        ws.onerror = () => {};

        ws.onmessage = (event) => {
            try {
                const msg = JSON.parse(event.data);
                appendMessage(msg);
                if (msg.type === 'DANMAKU') {
                    showDanmaku(msg.content);
                }
            } catch (e) {
                console.error('消息解析失败:', e);
            }
        };
    }

    // ========== 发送消息 ==========
    function sendMessage() {
        const input = document.getElementById('msgInput');
        const content = input.value.trim();
        if (!content || !ws || ws.readyState !== WebSocket.OPEN) return;

        const nickname = document.getElementById('nicknameInput').value.trim() || '匿名';
        const msg = {
            type: msgType,
            userId: 0,
            nickname: nickname,
            content: content,
            roomId: ROOM_ID
        };
        ws.send(JSON.stringify(msg));
        input.value = '';
    }

    function sendLike() {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        const nickname = document.getElementById('nicknameInput').value.trim() || '匿名';
        const msg = {
            type: 'LIKE',
            userId: 0,
            nickname: nickname,
            content: '点了一个赞',
            roomId: ROOM_ID
        };
        ws.send(JSON.stringify(msg));
    }

    // ========== 聊天消息渲染 ==========
    function appendMessage(msg) {
        const container = document.getElementById('chatMessages');
        const div = document.createElement('div');
        div.className = `msg ${msg.type.toLowerCase()}`;

        if (msg.type === 'LIKE') {
            div.innerHTML = `<span class="nickname">${esc(msg.nickname)}</span><span class="content">♥ ${esc(msg.content)}</span>`;
        } else {
            div.innerHTML = `<span class="nickname">${esc(msg.nickname)}:</span><span class="content">${esc(msg.content)}</span>`;
        }

        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    // ========== 弹幕 ==========
    let danmakuTrack = 0;
    function showDanmaku(text) {
        const layer = document.getElementById('danmakuLayer');
        const el = document.createElement('div');
        el.className = 'danmaku-item';
        el.textContent = text;
        // 随机轨道
        const trackCount = 8;
        danmakuTrack = (danmakuTrack + 1) % trackCount;
        el.style.top = (danmakuTrack * 40 + 20) + 'px';
        const duration = 6 + Math.random() * 3;
        el.style.animationDuration = duration + 's';
        el.style.left = '100%';
        layer.appendChild(el);
        setTimeout(() => el.remove(), duration * 1000 + 500);
    }

    // ========== 工具函数 ==========
    function setMsgType(btn) {
        document.querySelectorAll('.msg-type-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        msgType = btn.dataset.type;
    }

    function copyText(el) {
        navigator.clipboard.writeText(el.textContent).then(() => {
            const orig = el.textContent;
            el.textContent = '已复制!';
            setTimeout(() => el.textContent = orig, 1000);
        });
    }

    function esc(str) {
        const d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
    }
</script>

</body>
</html>
