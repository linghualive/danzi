<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直播电商平台</title>
    <script src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f0f;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
        }
        a { color: inherit; text-decoration: none; }

        /* ===== 顶部导航 ===== */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
            padding: 0 24px;
            height: 56px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .navbar .logo {
            font-size: 18px;
            font-weight: 700;
            color: #4fc3f7;
            cursor: pointer;
            white-space: nowrap;
        }
        .navbar .nav-spacer { flex: 1; }
        .navbar .nav-user {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }
        .navbar .user-nickname {
            color: #aaa;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ===== 通用按钮 ===== */
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            transition: background .2s, opacity .2s;
            white-space: nowrap;
        }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn-primary { background: #4fc3f7; color: #000; }
        .btn-primary:hover:not(:disabled) { background: #39b0e0; }
        .btn-danger { background: #e53935; color: #fff; }
        .btn-danger:hover:not(:disabled) { background: #c62828; }
        .btn-outline {
            background: transparent;
            border: 1px solid #444;
            color: #ccc;
        }
        .btn-outline:hover:not(:disabled) { border-color: #4fc3f7; color: #4fc3f7; }
        .btn-success { background: #43a047; color: #fff; }
        .btn-success:hover:not(:disabled) { background: #2e7d32; }
        .btn-warning { background: #ff9800; color: #000; }
        .btn-warning:hover:not(:disabled) { background: #e68a00; }
        .btn-sm { padding: 5px 12px; font-size: 12px; }
        .btn-like-send { background: #e91e63; color: #fff; font-size: 18px; padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; }
        .btn-like-send:hover { background: #c2185b; }

        /* ===== 视图容器 ===== */
        .view { display: none; }
        .view.active { display: block; }

        /* ===== 登录/注册页 ===== */
        .auth-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            padding: 32px;
        }
        .auth-card h2 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 24px;
            color: #4fc3f7;
        }
        .auth-tabs {
            display: flex;
            margin-bottom: 24px;
            border-bottom: 1px solid #333;
        }
        .auth-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            color: #888;
            font-size: 15px;
            border-bottom: 2px solid transparent;
            transition: all .2s;
        }
        .auth-tab.active { color: #4fc3f7; border-bottom-color: #4fc3f7; }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #888;
            margin-bottom: 6px;
        }
        .form-input {
            width: 100%;
            padding: 10px 14px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color .2s;
        }
        .form-input:focus { border-color: #4fc3f7; }
        .auth-card .btn { width: 100%; margin-top: 8px; padding: 12px; font-size: 15px; }
        .auth-error {
            color: #e53935;
            font-size: 13px;
            margin-top: 8px;
            min-height: 20px;
        }

        /* ===== 直播间列表 ===== */
        .rooms-page { padding: 24px; max-width: 1200px; margin: 0 auto; }
        .rooms-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .rooms-header h2 { font-size: 22px; flex: 1; }
        .filter-group {
            display: flex;
            gap: 8px;
        }
        .filter-btn {
            padding: 6px 14px;
            border: 1px solid #444;
            background: transparent;
            color: #aaa;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all .2s;
        }
        .filter-btn.active { border-color: #4fc3f7; color: #4fc3f7; background: rgba(79,195,247,.1); }
        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .room-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: border-color .2s, transform .15s;
        }
        .room-card:hover { border-color: #4fc3f7; transform: translateY(-2px); }
        .room-card .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .room-card .card-meta {
            font-size: 13px;
            color: #888;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-0 { background: #555; color: #aaa; }
        .status-1 { background: #e53935; color: #fff; animation: pulse 1.5s infinite; }
        .status-2 { background: #333; color: #888; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.7} }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }

        /* ===== 创建直播间弹窗 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.6);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            width: 90%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
        }
        .modal h3 { font-size: 18px; margin-bottom: 20px; }
        .modal .form-group:last-of-type { margin-bottom: 20px; }
        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        /* ===== 直播间详情页 ===== */
        .room-detail {
            display: flex;
            height: calc(100vh - 56px);
        }
        .room-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .room-top-bar {
            padding: 12px 20px;
            background: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .room-top-bar .back-btn {
            color: #aaa;
            cursor: pointer;
            font-size: 18px;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .room-top-bar .back-btn:hover { background: #2a2a2a; }
        .room-top-bar h2 { font-size: 17px; font-weight: 600; flex: 1; }
        .video-wrapper {
            flex: 1;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 300px;
        }
        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .video-placeholder {
            text-align: center;
            color: #666;
        }
        .video-placeholder .icon { font-size: 64px; margin-bottom: 16px; }

        /* 弹幕 */
        .danmaku-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .danmaku-item {
            position: absolute;
            white-space: nowrap;
            font-size: 22px;
            font-weight: 600;
            color: #fff;
            text-shadow: 1px 1px 3px rgba(0,0,0,.8);
            animation: danmaku-scroll linear forwards;
        }
        @keyframes danmaku-scroll {
            from { transform: translateX(0); }
            to { transform: translateX(calc(-100% - 100vw)); }
        }

        /* OBS 信息 */
        .obs-info {
            padding: 10px 20px;
            background: #1a1a1a;
            border-top: 1px solid #2a2a2a;
            font-size: 13px;
            color: #aaa;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .obs-info label { color: #666; margin-right: 4px; }
        .obs-info code {
            background: #2a2a2a;
            padding: 2px 8px;
            border-radius: 4px;
            color: #4fc3f7;
            font-size: 12px;
            cursor: pointer;
        }
        .obs-info code:hover { background: #333; }

        /* 右侧面板 */
        .room-right {
            width: 380px;
            display: flex;
            flex-direction: column;
            background: #1a1a1a;
            border-left: 1px solid #2a2a2a;
        }
        .right-tabs {
            display: flex;
            border-bottom: 1px solid #2a2a2a;
        }
        .right-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            color: #888;
            font-size: 14px;
            border-bottom: 2px solid transparent;
            transition: all .2s;
        }
        .right-tab.active { color: #4fc3f7; border-bottom-color: #4fc3f7; }
        .right-panel { flex: 1; overflow-y: auto; display: none; }
        .right-panel.active { display: flex; flex-direction: column; }

        /* 聊天面板 */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
        }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }
        .msg { margin-bottom: 10px; line-height: 1.5; font-size: 14px; }
        .msg .nickname { font-weight: 600; margin-right: 6px; }
        .msg.system { color: #666; font-size: 12px; text-align: center; }
        .msg.danmaku .nickname { color: #4fc3f7; }
        .msg.like .nickname { color: #e91e63; }
        .msg.like .content { color: #e91e63; }
        .chat-input-area {
            padding: 12px 16px;
            border-top: 1px solid #2a2a2a;
        }
        .ws-status {
            font-size: 11px;
            padding: 4px 0;
            text-align: center;
        }
        .ws-status.connected { color: #4caf50; }
        .ws-status.disconnected { color: #f44336; }
        .msg-type-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .msg-type-btn {
            flex: 1;
            padding: 6px;
            border: 1px solid #444;
            background: transparent;
            color: #aaa;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all .2s;
        }
        .msg-type-btn.active { border-color: #4fc3f7; color: #4fc3f7; background: rgba(79,195,247,.1); }
        .input-row {
            display: flex;
            gap: 8px;
        }
        .input-row input {
            flex: 1;
            padding: 8px 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .input-row input:focus { border-color: #4fc3f7; }

        /* 商品面板 */
        .product-list { padding: 12px 16px; }
        .product-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #222;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .product-thumb {
            width: 60px;
            height: 60px;
            background: #333;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }
        .product-info { flex: 1; min-width: 0; }
        .product-info .name {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .product-info .price { color: #e53935; font-size: 15px; font-weight: 600; }
        .product-info .stock { color: #888; font-size: 12px; margin-left: 8px; }
        .product-actions {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* ===== 商品详情弹窗 ===== */
        .product-detail-modal .modal { max-width: 520px; }
        .pd-header {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .pd-image {
            width: 160px;
            height: 160px;
            background: #2a2a2a;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            flex-shrink: 0;
        }
        .pd-info { flex: 1; }
        .pd-info h4 { font-size: 18px; margin-bottom: 8px; }
        .pd-info .pd-price { color: #e53935; font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .pd-info .pd-stock { color: #888; font-size: 13px; margin-bottom: 12px; }
        .pd-desc {
            color: #aaa;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
            padding: 12px;
            background: #222;
            border-radius: 6px;
        }
        .qty-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .qty-row label { font-size: 14px; color: #aaa; }
        .qty-control {
            display: flex;
            align-items: center;
            gap: 0;
        }
        .qty-control button {
            width: 32px;
            height: 32px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }
        .qty-control button:first-child { border-radius: 6px 0 0 6px; }
        .qty-control button:last-child { border-radius: 0 6px 6px 0; }
        .qty-control input {
            width: 48px;
            height: 32px;
            text-align: center;
            background: #2a2a2a;
            border: 1px solid #444;
            border-left: none;
            border-right: none;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        /* ===== 订单页 ===== */
        .orders-page { padding: 24px; max-width: 900px; margin: 0 auto; }
        .orders-page h2 { font-size: 22px; margin-bottom: 24px; }
        .order-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        .order-header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 20px;
            background: #222;
            font-size: 13px;
            color: #aaa;
            flex-wrap: wrap;
        }
        .order-header .order-no { font-family: monospace; color: #4fc3f7; }
        .order-status {
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 500;
        }
        .order-status-0 { background: #ff9800; color: #000; }
        .order-status-1 { background: #43a047; color: #fff; }
        .order-status-2 { background: #555; color: #aaa; }
        .order-body { padding: 16px 20px; }
        .order-items { margin-bottom: 12px; }
        .order-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            font-size: 14px;
        }
        .order-item-row .item-name { flex: 1; }
        .order-item-row .item-qty { color: #888; margin: 0 16px; }
        .order-item-row .item-price { color: #e53935; font-weight: 500; }
        .order-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            border-top: 1px solid #2a2a2a;
        }
        .order-total { font-size: 16px; }
        .order-total span { color: #e53935; font-weight: 700; font-size: 18px; }
        .order-actions { display: flex; gap: 8px; }

        /* ===== Toast ===== */
        .toast-container {
            position: fixed;
            top: 72px;
            right: 24px;
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            color: #fff;
            animation: toast-in .3s ease;
            max-width: 360px;
        }
        .toast-success { background: #2e7d32; }
        .toast-error { background: #c62828; }
        .toast-info { background: #1565c0; }
        @keyframes toast-in { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }

        /* ===== 加载 ===== */
        .loading-spinner {
            display: inline-block;
            width: 20px; height: 20px;
            border: 2px solid #444;
            border-top-color: #4fc3f7;
            border-radius: 50%;
            animation: spin .6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .page-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
            gap: 12px;
            color: #888;
        }
    </style>
</head>
<body>

<!-- Toast 容器 -->
<div class="toast-container" id="toastContainer"></div>

<!-- ===== 导航栏 ===== -->
<nav class="navbar" id="navbar" style="display:none">
    <div class="logo" onclick="navigate('rooms')">Live Commerce</div>
    <div class="nav-spacer"></div>
    <div class="nav-user">
        <span class="user-nickname" id="navNickname"></span>
        <button class="btn btn-outline btn-sm" onclick="navigate('orders')">我的订单</button>
        <button class="btn btn-outline btn-sm" onclick="showCreateRoomModal()">创建直播间</button>
        <button class="btn btn-sm" style="color:#e53935;border:1px solid #e53935;background:transparent" onclick="logout()">退出</button>
    </div>
</nav>

<!-- ===== View 1: 登录/注册 ===== -->
<div class="view" id="view-login">
    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>Live Commerce</h2>
            <div class="auth-tabs">
                <div class="auth-tab active" onclick="switchAuthTab('login')">登录</div>
                <div class="auth-tab" onclick="switchAuthTab('register')">注册</div>
            </div>
            <!-- 登录表单 -->
            <div id="loginForm">
                <div class="form-group">
                    <label>用户名</label>
                    <input class="form-input" id="loginUsername" placeholder="请输入用户名" />
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input class="form-input" id="loginPassword" type="password" placeholder="请输入密码"
                           onkeydown="if(event.key==='Enter')doLogin()" />
                </div>
                <div class="auth-error" id="loginError"></div>
                <button class="btn btn-primary" onclick="doLogin()" id="loginBtn">登录</button>
            </div>
            <!-- 注册表单 -->
            <div id="registerForm" style="display:none">
                <div class="form-group">
                    <label>用户名</label>
                    <input class="form-input" id="regUsername" placeholder="请输入用户名" />
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input class="form-input" id="regPassword" type="password" placeholder="请输入密码" />
                </div>
                <div class="form-group">
                    <label>昵称</label>
                    <input class="form-input" id="regNickname" placeholder="请输入昵称"
                           onkeydown="if(event.key==='Enter')doRegister()" />
                </div>
                <div class="auth-error" id="regError"></div>
                <button class="btn btn-primary" onclick="doRegister()" id="regBtn">注册</button>
            </div>
        </div>
    </div>
</div>

<!-- ===== View 2: 直播间列表 ===== -->
<div class="view" id="view-rooms">
    <div class="rooms-page">
        <div class="rooms-header">
            <h2>直播间大厅</h2>
            <div class="filter-group">
                <button class="filter-btn active" onclick="filterRooms(null, this)">全部</button>
                <button class="filter-btn" onclick="filterRooms(1, this)">直播中</button>
                <button class="filter-btn" onclick="filterRooms(0, this)">未开播</button>
                <button class="filter-btn" onclick="filterRooms(2, this)">已结束</button>
            </div>
        </div>
        <div id="roomsContainer"></div>
    </div>
</div>

<!-- ===== View 3: 直播间详情 ===== -->
<div class="view" id="view-room">
    <div class="room-detail">
        <div class="room-left">
            <div class="room-top-bar">
                <span class="back-btn" onclick="navigate('rooms')">&#9664; 返回</span>
                <h2 id="roomDetailTitle">加载中...</h2>
                <span id="roomDetailBadge" class="status-badge status-0">未开播</span>
                <span id="roomControls"></span>
            </div>
            <div class="video-wrapper" id="videoWrapper">
                <video id="videoPlayer" controls autoplay muted></video>
                <div id="videoPlaceholder" class="video-placeholder" style="display:none">
                    <div class="icon">&#128250;</div>
                    <p>主播尚未开播，请稍候...</p>
                </div>
                <div class="danmaku-layer" id="danmakuLayer"></div>
            </div>
            <div class="obs-info" id="obsInfo">
                <div><label>OBS 服务器:</label><code onclick="copyText(this)">rtmp://localhost:1935/live</code></div>
                <div><label>推流密钥:</label><code id="streamKeyDisplay" onclick="copyText(this)">-</code></div>
                <div><label>拉流地址:</label><code id="pullUrlDisplay" onclick="copyText(this)">-</code></div>
            </div>
        </div>
        <div class="room-right">
            <div class="right-tabs">
                <div class="right-tab active" onclick="switchRightTab('chat', this)">聊天互动</div>
                <div class="right-tab" onclick="switchRightTab('products', this)">商品推荐</div>
            </div>
            <!-- 聊天面板 -->
            <div class="right-panel active" id="panel-chat">
                <div class="chat-messages" id="chatMessages">
                    <div class="msg system">欢迎来到直播间</div>
                </div>
                <div class="chat-input-area">
                    <div class="ws-status disconnected" id="wsStatus">未连接</div>
                    <div class="msg-type-row">
                        <button class="msg-type-btn active" data-type="COMMENT" onclick="setMsgType(this)">评论</button>
                        <button class="msg-type-btn" data-type="DANMAKU" onclick="setMsgType(this)">弹幕</button>
                    </div>
                    <div class="input-row">
                        <input id="msgInput" placeholder="说点什么..." onkeydown="if(event.key==='Enter')sendMessage()" />
                        <button class="btn btn-primary" onclick="sendMessage()">发送</button>
                        <button class="btn-like-send" onclick="sendLike()">&#9829;</button>
                    </div>
                </div>
            </div>
            <!-- 商品面板 -->
            <div class="right-panel" id="panel-products">
                <div class="product-list" id="productList"></div>
            </div>
        </div>
    </div>
</div>

<!-- ===== View 4: 我的订单 ===== -->
<div class="view" id="view-orders">
    <div class="orders-page">
        <h2>我的订单</h2>
        <div id="ordersContainer"></div>
    </div>
</div>

<!-- ===== 创建直播间弹窗 ===== -->
<div class="modal-overlay" id="createRoomModal">
    <div class="modal">
        <h3>创建直播间</h3>
        <div class="form-group">
            <label>直播间标题</label>
            <input class="form-input" id="newRoomTitle" placeholder="输入直播间标题" />
        </div>
        <div class="modal-actions">
            <button class="btn btn-outline" onclick="closeModal('createRoomModal')">取消</button>
            <button class="btn btn-primary" onclick="doCreateRoom()">创建</button>

</div>

<!-- ===== 商品详情弹窗 ===== -->
<div class="modal-overlay product-detail-modal" id="productDetailModal">
    <div class="modal">
        <div class="pd-header">
            <div class="pd-image" id="pdImage">&#128230;</div>
            <div class="pd-info">
                <h4 id="pdName">-</h4>
                <div class="pd-price" id="pdPrice">-</div>
                <div class="pd-stock" id="pdStock">-</div>
            </div>
        </div>

                <button onclick="changeQty(-1)">-</button>

            <button class="btn btn-primary" onclick="buyFromDetail()">立即购买</button>
        </div>

<script>
// =============================================
//  全局状态
// =============================================
const API_BASE = 'http://localhost:9000';
const STATUS_TEXT = ['未开播', '直播中', '已结束'];
const ORDER_STATUS_TEXT = ['待支付', '已支付', '已取消'];

let currentUser = null;   // { id, username, nickname, token }
let currentRoomId = null;
let currentRoom = null;
let flvPlayer = null;
let ws = null;
let wsMsgType = 'COMMENT';
let roomPollTimer = null;
let danmakuTrack = 0;
let roomFilter = null;
let allRooms = [];
let currentProduct = null; // 商品详情弹窗用

// =============================================
//  初始化 & 路由
// =============================================
window.addEventListener('hashchange', handleRoute);
window.addEventListener('load', () => {
    const saved = localStorage.getItem('lc_user');
    if (saved) {
        try { currentUser = JSON.parse(saved); } catch(e) { localStorage.removeItem('lc_user'); }
    }
    handleRoute();
});

function handleRoute() {
    const hash = location.hash.slice(1) || '';
    // 如果没有登录，只允许 login 页
    if (!currentUser && hash !== 'login') {
        location.hash = '#login';
        return;
    }
    if (currentUser && (hash === 'login' || hash === '')) {
        location.hash = '#rooms';
        return;
    }

    // 清理上一个页面的资源
    cleanupRoom();

    // 隐藏所有视图
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('navbar').style.display = currentUser ? 'flex' : 'none';
    if (currentUser) {
        document.getElementById('navNickname').textContent = currentUser.nickname || currentUser.username;
    }

    if (hash === 'login') {
        showView('login');
    } else if (hash === 'rooms') {
        showView('rooms');
        loadRooms();
    } else if (hash.startsWith('room/')) {
        const roomId = parseInt(hash.split('/')[1]);
        if (roomId) {
            showView('room');
            enterRoom(roomId);
        } else {
            location.hash = '#rooms';
        }
    } else if (hash === 'orders') {
        showView('orders');
        loadOrders();
    } else {
        location.hash = '#rooms';
    }
}

function showView(name) {
    document.getElementById('view-' + name).classList.add('active');
}

function navigate(path) {
    location.hash = '#' + path;
}

// =============================================
//  API 工具
// =============================================
function authHeaders() {
    const h = { 'Content-Type': 'application/json' };
    if (currentUser && currentUser.token) {
        h['satoken'] = currentUser.token;
    }
    return h;
}

async function api(method, path, body) {
    const opts = { method, headers: authHeaders() };
    if (body !== undefined) opts.body = JSON.stringify(body);
    const res = await fetch(API_BASE + path, opts);
    const json = await res.json();
    return json;
}

// =============================================
//  Toast 提示
// =============================================
function toast(msg, type = 'info') {
    const container = document.getElementById('toastContainer');
    const el = document.createElement('div');
    el.className = 'toast toast-' + type;
    el.textContent = msg;
    container.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3000);
}

// =============================================
//  登录 / 注册
// =============================================
function switchAuthTab(tab) {
    document.querySelectorAll('.auth-tab').forEach((t, i) => {
        t.classList.toggle('active', (tab === 'login' ? i === 0 : i === 1));
    });
    document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
    document.getElementById('loginError').textContent = '';
    document.getElementById('regError').textContent = '';
}

async function doLogin() {
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value.trim();
    if (!username || !password) {
        document.getElementById('loginError').textContent = '请输入用户名和密码';
        return;
    }
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = '登录中...';
    try {
        const json = await api('POST', '/api/user/login', { username, password });
        if (json.code === 200) {
            saveUser(json.data);
            toast('登录成功', 'success');
            navigate('rooms');
        } else {
            document.getElementById('loginError').textContent = json.message || '登录失败';
        }
    } catch(e) {
        document.getElementById('loginError').textContent = '网络错误，请检查后端服务';
    }
    btn.disabled = false;
    btn.textContent = '登录';
}

async function doRegister() {
    const username = document.getElementById('regUsername').value.trim();
    const password = document.getElementById('regPassword').value.trim();
    const nickname = document.getElementById('regNickname').value.trim();
    if (!username || !password || !nickname) {
        document.getElementById('regError').textContent = '请填写所有字段';
        return;
    }
    const btn = document.getElementById('regBtn');
    btn.disabled = true;
    btn.textContent = '注册中...';
    try {
        const json = await api('POST', '/api/user/register', { username, password, nickname });
        if (json.code === 200) {
            toast('注册成功，自动登录中...', 'success');
            // 注册成功后自动登录
            const loginJson = await api('POST', '/api/user/login', { username, password });
            if (loginJson.code === 200) {
                saveUser(loginJson.data);
                navigate('rooms');
            } else {
                document.getElementById('regError').textContent = '注册成功但登录失败，请手动登录';
                switchAuthTab('login');
            }
        } else {
            document.getElementById('regError').textContent = json.message || '注册失败';
        }
    } catch(e) {
        document.getElementById('regError').textContent = '网络错误，请检查后端服务';
    }
    btn.disabled = false;
    btn.textContent = '注册';
}

function saveUser(data) {
    currentUser = data;
    localStorage.setItem('lc_user', JSON.stringify(data));
}

function logout() {
    currentUser = null;
    localStorage.removeItem('lc_user');
    navigate('login');
    toast('已退出登录', 'info');
}

// =============================================
//  直播间列表
// =============================================
async function loadRooms() {
    const container = document.getElementById('roomsContainer');
    container.innerHTML = '<div class="page-loading"><span class="loading-spinner"></span> 加载中...</div>';
    try {
        const json = await api('GET', '/api/live/room/list');
        if (json.code === 200) {
            const d = json.data;
            allRooms = Array.isArray(d) ? d : (d.content || d.records || []);
            renderRooms();
        } else {
            container.innerHTML = '<div class="empty-state"><div class="icon">&#128533;</div><p>' + esc(json.message || '加载失败') + '</p></div>';
        }
    } catch(e) {
        container.innerHTML = '<div class="empty-state"><div class="icon">&#128533;</div><p>网络错误，请检查后端服务</p></div>';
    }
}

function renderRooms() {
    const container = document.getElementById('roomsContainer');
    let rooms = allRooms;
    if (roomFilter !== null) {
        rooms = rooms.filter(r => r.status === roomFilter);
    }
    if (rooms.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon">&#128250;</div><p>暂无直播间</p></div>';
        return;
    }
    container.innerHTML = '<div class="rooms-grid">' + rooms.map(r => `
        <div class="room-card" onclick="navigate('room/${r.id}')">
            <div class="card-title">${esc(r.title)}</div>
            <div class="card-meta">
                <span class="status-badge status-${r.status}">${STATUS_TEXT[r.status]}</span>
                <span>ID: ${r.id}</span>
                ${r.anchorName ? '<span>主播: ' + esc(r.anchorName) + '</span>' : ''}
            </div>
        </div>
    `).join('') + '</div>';
}

function filterRooms(status, btn) {
    roomFilter = status;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderRooms();
}

// ===== 创建直播间 =====
function showCreateRoomModal() {
    document.getElementById('newRoomTitle').value = '';
    document.getElementById('createRoomModal').classList.add('show');
}

function closeModal(id) {
    document.getElementById(id).classList.remove('show');
}

async function doCreateRoom() {
    const title = document.getElementById('newRoomTitle').value.trim();
    if (!title) { toast('请输入直播间标题', 'error'); return; }
    try {
        const json = await api('POST', '/api/live/room', { title });
        if (json.code === 200) {
            toast('直播间创建成功', 'success');
            closeModal('createRoomModal');
            loadRooms();
        } else {
            toast(json.message || '创建失败', 'error');
        }
    } catch(e) {
        toast('网络错误', 'error');
    }
}

// =============================================
//  直播间详情
// =============================================
function cleanupRoom() {
    if (roomPollTimer) { clearInterval(roomPollTimer); roomPollTimer = null; }
    if (ws) { ws.onclose = null; ws.close(); ws = null; }
    stopPlayer();
    currentRoomId = null;
    currentRoom = null;
}

async function enterRoom(roomId) {
    currentRoomId = roomId;
    // 重置聊天
    document.getElementById('chatMessages').innerHTML = '<div class="msg system">欢迎来到直播间</div>';
    document.getElementById('wsStatus').textContent = '连接中...';
    document.getElementById('wsStatus').className = 'ws-status disconnected';
    // 重置右侧 tab
    switchRightTab('chat', document.querySelector('.right-tab'));

    await loadRoomDetail();
    await loadHistoryMessages();
    connectWebSocket();
    loadRoomProducts();
    roomPollTimer = setInterval(loadRoomDetail, 5000);
}

async function loadHistoryMessages() {
    try {
        const json = await api('GET', `/api/live/room/${currentRoomId}/messages?page=0&size=50`);
        if (json.code === 200 && json.data && json.data.content && json.data.content.length > 0) {
            const container = document.getElementById('chatMessages');
            // 历史消息按时间倒序返回，翻转为正序显示
            const messages = [...json.data.content].reverse();
            messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'msg ' + (msg.type || '').toLowerCase();
                if (msg.type === 'LIKE') {
                    div.innerHTML = '<span class="nickname">' + esc(msg.nickname) + '</span><span class="content">&#9829; ' + esc(msg.content) + '</span>';
                } else {
                    div.innerHTML = '<span class="nickname">' + esc(msg.nickname) + ':</span><span class="content">' + esc(msg.content) + '</span>';
                }
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }
    } catch(e) {
        console.error('加载历史消息失败:', e);
    }
}

async function loadRoomDetail() {
    try {
        const json = await api('GET', '/api/live/room/' + currentRoomId);
        if (json.code !== 200) return;
        const room = json.data;
        currentRoom = room;

        document.getElementById('roomDetailTitle').textContent = room.title;
        document.getElementById('streamKeyDisplay').textContent = room.streamKey || '-';
        document.getElementById('pullUrlDisplay').textContent = room.pullUrl || '-';

        const badge = document.getElementById('roomDetailBadge');
        badge.className = 'status-badge status-' + room.status;
        badge.textContent = STATUS_TEXT[room.status];

        // 房主显示开播/停播按钮
        const controls = document.getElementById('roomControls');
        if (currentUser && currentUser.userId === room.userId) {
            if (room.status === 0) {
                controls.innerHTML = '<button class="btn btn-success btn-sm" onclick="doStartLive()">开播</button>';
            } else if (room.status === 1) {
                controls.innerHTML = '<button class="btn btn-danger btn-sm" onclick="doStopLive()">停播</button>';
            } else {
                controls.innerHTML = '';
            }
        } else {
            controls.innerHTML = '';
        }

        const placeholder = document.getElementById('videoPlaceholder');
        const video = document.getElementById('videoPlayer');

        if (room.status === 1) {
            placeholder.style.display = 'none';
            video.style.display = 'block';
            if (!flvPlayer && room.pullUrl) startPlayer(room.pullUrl);
        } else {
            if (flvPlayer) stopPlayer();
            video.style.display = 'none';
            placeholder.style.display = 'block';
            placeholder.querySelector('p').textContent = room.status === 0 ? '主播尚未开播，请稍候...' : '直播已结束';
        }
    } catch(e) {
        console.error('加载房间失败:', e);
    }
}

// ===== 开播/停播 =====
async function doStartLive() {
    try {
        const json = await api('PUT', '/api/live/room/' + currentRoomId + '/start');
        if (json.code === 200) {
            toast('已开播', 'success');
            await loadRoomDetail();
        } else {
            toast(json.message || '开播失败', 'error');
        }
    } catch(e) {
        toast('网络错误', 'error');
    }
}

async function doStopLive() {
    try {
        const json = await api('PUT', '/api/live/room/' + currentRoomId + '/stop');
        if (json.code === 200) {
            toast('已停播', 'success');
            await loadRoomDetail();
        } else {
            toast(json.message || '停播失败', 'error');
        }
    } catch(e) {
        toast('网络错误', 'error');
    }
}

// ===== 直播间商品 =====
async function loadRoomProducts() {
    const container = document.getElementById('productList');
    container.innerHTML = '<div class="page-loading"><span class="loading-spinner"></span> 加载商品...</div>';

    let products = [];
    try {
        // 先尝试获取直播间关联商品
        const json = await api('GET', '/api/product/room/' + currentRoomId);
        if (json.code === 200 && json.data && json.data.length > 0) {
            products = json.data;
        }
    } catch(e) { /* 忽略 */ }

    // 如果没有关联商品，从全部商品中取
    if (products.length === 0) {
        try {
            const json = await api('GET', '/api/product/list');
            if (json.code === 200 && json.data) {
                // data 可能是分页结构 或 数组
                const list = Array.isArray(json.data) ? json.data : (json.data.records || json.data.content || []);
                // 随机取最多 6 个
                products = shuffle(list).slice(0, 6);
            }
        } catch(e) { /* 忽略 */ }
    }

    if (products.length === 0) {
        container.innerHTML = '<div class="empty-state" style="padding:30px"><div class="icon">&#128230;</div><p>暂无商品</p></div>';
        return;
    }

    container.innerHTML = products.map(p => `
        <div class="product-item">
            <div class="product-thumb">&#128230;</div>
            <div class="product-info">
                <div class="name">${esc(p.name || p.productName || '-')}</div>
                <div>
                    <span class="price">&yen;${formatPrice(p.price)}</span>
                    <span class="stock">库存: ${p.stock ?? '-'}</span>
                </div>
            </div>
            <div class="product-actions">
                <button class="btn btn-outline btn-sm" onclick='showProductDetail(${JSON.stringify(p).replace(/'/g,"&#39;")})'>详情</button>
                <button class="btn btn-primary btn-sm" onclick='quickBuy(${p.id})'>购买</button>
            </div>
        </div>
    `).join('');
}

// ===== FLV 播放器 =====
function startPlayer(url) {
    if (!flvjs.isSupported()) {
        toast('浏览器不支持 FLV 播放，请使用 Chrome/Edge', 'error');
        return;
    }
    const video = document.getElementById('videoPlayer');
    flvPlayer = flvjs.createPlayer({
        type: 'flv', isLive: true, url: url
    }, {
        enableWorker: false, enableStashBuffer: false,
        stashInitialSize: 128, lazyLoad: false
    });
    flvPlayer.attachMediaElement(video);
    flvPlayer.load();
    flvPlayer.play().catch(() => {});
    flvPlayer.on(flvjs.Events.ERROR, () => {
        setTimeout(() => { stopPlayer(); loadRoomDetail(); }, 3000);
    });
}

function stopPlayer() {
    if (flvPlayer) {
        try { flvPlayer.pause(); flvPlayer.unload(); flvPlayer.detachMediaElement(); flvPlayer.destroy(); } catch(e) {}
        flvPlayer = null;
    }
}

// ===== WebSocket =====
function connectWebSocket() {
    if (!currentRoomId) return;
    const wsUrl = `ws://localhost:9000/ws/live/${currentRoomId}`;
    ws = new WebSocket(wsUrl);

    ws.onopen = () => {
        document.getElementById('wsStatus').textContent = '已连接';
        document.getElementById('wsStatus').className = 'ws-status connected';
    };
    ws.onclose = () => {
        document.getElementById('wsStatus').textContent = '已断开，3秒后重连...';
        document.getElementById('wsStatus').className = 'ws-status disconnected';
        if (currentRoomId) setTimeout(connectWebSocket, 3000);
    };
    ws.onerror = () => {};
    ws.onmessage = (event) => {
        try {
            const msg = JSON.parse(event.data);
            appendMessage(msg);
            if (msg.type === 'DANMAKU') showDanmaku(msg.content);
        } catch(e) {}
    };
}

function sendMessage() {
    const input = document.getElementById('msgInput');
    const content = input.value.trim();
    if (!content || !ws || ws.readyState !== WebSocket.OPEN) return;
    const nickname = currentUser ? (currentUser.nickname || currentUser.username) : '匿名';
    ws.send(JSON.stringify({
        type: wsMsgType,
        userId: currentUser ? currentUser.id : 0,
        nickname: nickname,
        content: content,
        roomId: currentRoomId
    }));
    input.value = '';
}

function sendLike() {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const nickname = currentUser ? (currentUser.nickname || currentUser.username) : '匿名';
    ws.send(JSON.stringify({
        type: 'LIKE',
        userId: currentUser ? currentUser.id : 0,
        nickname: nickname,
        content: '点了一个赞',
        roomId: currentRoomId
    }));
}

function appendMessage(msg) {
    const container = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = 'msg ' + (msg.type || '').toLowerCase();
    if (msg.type === 'LIKE') {
        div.innerHTML = '<span class="nickname">' + esc(msg.nickname) + '</span><span class="content">&#9829; ' + esc(msg.content) + '</span>';
    } else {
        div.innerHTML = '<span class="nickname">' + esc(msg.nickname) + ':</span><span class="content">' + esc(msg.content) + '</span>';
    }
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

function showDanmaku(text) {
    const layer = document.getElementById('danmakuLayer');
    const el = document.createElement('div');
    el.className = 'danmaku-item';
    el.textContent = text;
    const trackCount = 8;
    danmakuTrack = (danmakuTrack + 1) % trackCount;
    el.style.top = (danmakuTrack * 40 + 20) + 'px';
    const duration = 6 + Math.random() * 3;
    el.style.animationDuration = duration + 's';
    el.style.left = '100%';
    layer.appendChild(el);
    setTimeout(() => el.remove(), duration * 1000 + 500);
}

function setMsgType(btn) {
    document.querySelectorAll('.msg-type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    wsMsgType = btn.dataset.type;
}

function switchRightTab(panel, tab) {
    document.querySelectorAll('.right-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.right-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + panel).classList.add('active');
}

// =============================================
//  商品详情弹窗
// =============================================
function showProductDetail(product) {
    currentProduct = product;
    document.getElementById('pdName').textContent = product.name || product.productName || '-';
    document.getElementById('pdPrice').textContent = '\u00A5' + formatPrice(product.price);
    document.getElementById('pdStock').textContent = '库存: ' + (product.stock ?? '-');
    document.getElementById('pdDesc').textContent = product.description || product.desc || '暂无描述';
    document.getElementById('pdQty').value = 1;
    document.getElementById('productDetailModal').classList.add('show');
}

function changeQty(delta) {
    const input = document.getElementById('pdQty');
    let val = parseInt(input.value) || 1;
    val = Math.max(1, val + delta);
    if (currentProduct && currentProduct.stock !== undefined) {
        val = Math.min(val, currentProduct.stock);
    }
    input.value = val;
}

async function buyFromDetail() {
    if (!currentProduct) return;
    const qty = parseInt(document.getElementById('pdQty').value) || 1;
    await createOrder(currentProduct.id, qty);
    closeModal('productDetailModal');
}

async function quickBuy(productId) {
    await createOrder(productId, 1);
}

async function createOrder(productId, quantity) {
    try {
        const json = await api('POST', '/api/order', {
            items: [{ productId: productId, quantity: quantity }]
        });
        if (json.code === 200) {
            toast('下单成功！', 'success');
        } else {
            toast(json.message || '下单失败', 'error');
        }
    } catch(e) {
        toast('网络错误', 'error');
    }
}

// =============================================
//  我的订单
// =============================================
async function loadOrders() {
    const container = document.getElementById('ordersContainer');
    container.innerHTML = '<div class="page-loading"><span class="loading-spinner"></span> 加载订单...</div>';
    try {
        const json = await api('GET', '/api/order/list');
        if (json.code === 200) {
            const orders = Array.isArray(json.data) ? json.data : (json.data?.records || json.data?.content || []);
            if (orders.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="icon">&#128230;</div><p>暂无订单</p></div>';
                return;
            }
            container.innerHTML = orders.map(renderOrderCard).join('');
        } else {
            container.innerHTML = '<div class="empty-state"><div class="icon">&#128533;</div><p>' + esc(json.message || '加载失败') + '</p></div>';
        }
    } catch(e) {
        container.innerHTML = '<div class="empty-state"><div class="icon">&#128533;</div><p>网络错误，请检查后端服务</p></div>';
    }
}

function renderOrderCard(order) {
    const items = order.items || order.orderItems || [];
    const statusClass = 'order-status-' + (order.status ?? 0);
    const statusText = ORDER_STATUS_TEXT[order.status] || '未知';
    const totalAmount = order.totalAmount || order.amount || 0;

    let actions = '';
    if (order.status === 0) {
        actions = `
            <button class="btn btn-success btn-sm" onclick="payOrder(${order.id})">支付</button>
            <button class="btn btn-outline btn-sm" onclick="cancelOrder(${order.id})">取消</button>
        `;
    }

    return `
        <div class="order-card">
            <div class="order-header">
                <span>订单号: <span class="order-no">${esc(order.orderNo || order.id + '')}</span></span>
                <span class="order-status ${statusClass}">${statusText}</span>
                ${order.createTime ? '<span>' + esc(order.createTime) + '</span>' : ''}
            </div>
            <div class="order-body">
                <div class="order-items">
                    ${items.length > 0 ? items.map(item => `
                        <div class="order-item-row">
                            <span class="item-name">${esc(item.productName || item.name || '商品')}</span>
                            <span class="item-qty">x${item.quantity || 1}</span>
                            <span class="item-price">&yen;${formatPrice(item.price || item.amount || 0)}</span>
                        </div>
                    `).join('') : '<div class="order-item-row"><span class="item-name" style="color:#888">商品信息</span></div>'}
                </div>
            </div>
            <div class="order-footer">
                <div class="order-total">合计: <span>&yen;${formatPrice(totalAmount)}</span></div>
                <div class="order-actions">${actions}</div>
            </div>
        </div>
    `;
}

async function payOrder(orderId) {
    try {
        const json = await api('PUT', '/api/order/' + orderId + '/pay');
        if (json.code === 200) {
            toast('支付成功', 'success');
            loadOrders();
        } else {
            toast(json.message || '支付失败', 'error');
        }
    } catch(e) {
        toast('网络错误', 'error');
    }
}

async function cancelOrder(orderId) {
    try {
        const json = await api('PUT', '/api/order/' + orderId + '/cancel');
        if (json.code === 200) {
            toast('订单已取消', 'info');
            loadOrders();
        } else {
            toast(json.message || '取消失败', 'error');
        }
    } catch(e) {
        toast('网络错误', 'error');
    }
}

// =============================================
//  工具函数
// =============================================
function esc(str) {
    if (str === null || str === undefined) return '';
    const d = document.createElement('div');
    d.textContent = String(str);
    return d.innerHTML;
}

function copyText(el) {
    navigator.clipboard.writeText(el.textContent).then(() => {
        const orig = el.textContent;
        el.textContent = '已复制!';
        setTimeout(() => el.textContent = orig, 1000);
    });
}

function formatPrice(price) {
    if (price === null || price === undefined) return '0.00';
    return Number(price).toFixed(2);
}

function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

// 点击弹窗外部关闭
document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', (e) => {
        if (e.target === overlay) overlay.classList.remove('show');
    });
});
</script>
