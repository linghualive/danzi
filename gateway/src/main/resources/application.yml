server:
  port: 9000

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: base-service-user
          uri: http://localhost:9001
          predicates:
            - Path=/api/user/**
        - id: base-service-live
          uri: http://localhost:9001
          predicates:
            - Path=/api/live/**
        - id: base-service-admin
          uri: http://localhost:9001
          predicates:
            - Path=/api/admin/**
        - id: base-service-media
          uri: http://localhost:9001
          predicates:
            - Path=/api/base/media/**
        - id: mall-service-product
          uri: http://localhost:9002
          predicates:
            - Path=/api/product/**
        - id: mall-service-order
          uri: http://localhost:9002
          predicates:
            - Path=/api/order/**
        - id: websocket
          uri: ws://localhost:9001
          predicates:
            - Path=/ws/**
  data:
    redis:
      host: localhost
      port: 6379

sa-token:
  token-name: satoken
  timeout: 86400
  is-concurrent: true
  is-share: true
  is-read-cookie: false
  is-read-header: true
