server:
  port: 9001

spring:
  application:
    name: base-service
  datasource:
    url: jdbc:mysql://localhost:3306/base_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  data:
    redis:
      host: localhost
      port: 6379

sa-token:
  token-name: satoken
  timeout: 86400
  is-concurrent: true
  is-share: true
  is-read-cookie: false
  is-read-header: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
