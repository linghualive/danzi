server:
  port: 9002

spring:
  application:
    name: mall-service
  datasource:
    url: jdbc:mysql://localhost:3306/mall_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: localhost
      port: 6379

sa-token:
  token-name: satoken
  timeout: 86400
  is-concurrent: true
  is-share: true
  is-read-cookie: false
  is-read-header: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
